# pegasus-htcondor pool — common settings (ALL nodes).
# Rendered per node by bootstrap_pegasus_node.sh: __CONDOR_HOST__ / __NODE_IP__ /
# __FABNET_CIDR__ are substituted before this lands in /etc/condor/config.d/.

# Central manager (collector + negotiator) for the whole pool = the submit node.
CONDOR_HOST = __CONDOR_HOST__

# Bind daemons to the FABNetv4 DATA PLANE, not the management NIC (SSH-only).
# Each node advertises its own FABNet IP so collector<->schedd<->startd traffic
# stays on the private routed network. Nodes share one FABNet /24, so they are
# directly connected — no extra route is needed inside the pool.
NETWORK_INTERFACE = __NODE_IP__

# FABRIC's data plane is IPv4-only (FABNetv4); the nodes also carry a global IPv6
# that is NOT routed between slivers. Left enabled, daemons advertise dual-stack
# and the schedd tries the unreachable IPv6 address first on REQUEST_CLAIM —
# timing out ~45s per match and leaving jobs stuck Idle forever. Force IPv4-only.
ENABLE_IPV4 = TRUE
ENABLE_IPV6 = FALSE

# --- Security -------------------------------------------------------------
# Shared pool signing key ("pool password"): the provisioner installs the SAME
# secret on every node (condor_store_cred add -c), so daemons authenticate to
# each other. Host-based authorization further limits who may talk to the pool
# to this slice's FABNet subnet. (Harden to IDTOKENS for production — see
# deploy/PEGASUS-HTCONDOR.md.)
SEC_DEFAULT_AUTHENTICATION = REQUIRED
SEC_DEFAULT_INTEGRITY = REQUIRED
# FS (filesystem) authenticates LOCAL user commands (condor_q / condor_submit,
# incl. pegasus-plan --submit) by Unix file ownership — needed because the pool
# PASSWORD key is daemon-only (root-readable), so a normal user cannot present
# it. HTCondor tries methods in order: FS works same-host; remote daemon<->daemon
# traffic falls through to PASSWORD (FS can't span hosts).
SEC_DEFAULT_AUTHENTICATION_METHODS = FS, PASSWORD
SEC_PASSWORD_DIRECTORY = /etc/condor/passwords.d

ALLOW_READ = $(ALLOW_READ) __FABNET_CIDR__ 127.0.0.1
ALLOW_WRITE = $(ALLOW_WRITE) __FABNET_CIDR__ 127.0.0.1
ALLOW_DAEMON = $(ALLOW_DAEMON) __FABNET_CIDR__ 127.0.0.1
ALLOW_ADVERTISE = $(ALLOW_ADVERTISE) __FABNET_CIDR__ 127.0.0.1
ALLOW_NEGOTIATOR = $(ALLOW_NEGOTIATOR) __CONDOR_HOST__ 127.0.0.1
