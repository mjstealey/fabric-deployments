# pegasus-htcondor pool — execute (worker) node.
# Runs a startd that advertises all of the node's resources as one
# partitionable slot, so Pegasus/DAGMan jobs carve out exactly what they
# request_cpus / request_memory for.

use ROLE : Execute

NUM_SLOTS_TYPE_1 = 1
SLOT_TYPE_1 = 100%
SLOT_TYPE_1_PARTITIONABLE = True

# Always willing to run pool jobs; the PASSWORD auth + FABNet ALLOW rules in
# 00-pool-common.conf already gate who may submit here.
START = True
